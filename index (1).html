  const clean = word.replace(/\(.*?\)/g, '').trim();
  if (!clean) return false;
  const lastChar = clean[clean.length - 1];
  const code = lastChar.charCodeAt(0);

  // 한글 음절 범위 (가 ~ 힣)
  if (code >= 0xAC00 && code <= 0xD7A3) {
    const jongseong = (code - 0xAC00) % 28;
    return jongseong !== 0; // 0이면 받침 없음, 1~27이면 받침 있음 (ㄹ=8 포함)
  }
  // 숫자 끝자리 판별 (0,1,3,6,7,8 -> 받침 있음 / 2,4,5,9 -> 받침 없음)
  if (/[0-9]/.test(lastChar)) {
    return ['0', '1', '3', '6', '7', '8'].includes(lastChar);
  }
  return false;
}

// '으로/로'는 ㄹ 받침일 때 '로'를 써야 하므로 별도 판별
function isRieulFinal(word) {
  const clean = word.replace(/\(.*?\)/g, '').trim();
  if (!clean) return false;
  const lastChar = clean[clean.length - 1];
  const code = lastChar.charCodeAt(0);
  if (code >= 0xAC00 && code <= 0xD7A3) {
    return ((code - 0xAC00) % 28) === 8; // 종성 8번 = ㄹ
  }
  if (/[0-9]/.test(lastChar)) {
    return ['1', '7', '8'].includes(lastChar); // 일, 칠, 팔
  }
  return false;
}

// replacementWord 뒤에 바로 붙는 텍스트(afterText)의 첫머리가 조사인 경우 교정
function adjustFollowingParticle(replacementWord, afterText) {
  if (!afterText || !replacementWord) return { particle: '', rest: afterText };

  const hasBatchim = hasFinalConsonant(replacementWord);
  const hasRieul = isRieulFinal(replacementWord);

  // 긴 복합 조사부터 먼저 체크 (예: '으로는', '에서는' 등)
  const rules = [
    // 으로 / 로
    {
      pattern: /^(으로는|로써|로서|으로|로)(?=[\s.,!?;:'"\)\]]|$)/,
      fix: (m) => {
        const suffix = m.replace(/^(으로|로)/, '');
        const base = (!hasBatchim || hasRieul) ? '로' : '으로';
        return base + suffix;
      }
    },
    // 을 / 를
    {
      pattern: /^(을|를)(?=[\s.,!?;:'"\)\]]|$)/,
      fix: () => hasBatchim ? '을' : '를'
    },
    // 이 / 가
    {
      pattern: /^(이|가)(?=[\s.,!?;:'"\)\]]|$)/,
      fix: () => hasBatchim ? '이' : '가'
    },
    // 은 / 는
    {
      pattern: /^(은|는)(?=[\s.,!?;:'"\)\]]|$)/,
      fix: () => hasBatchim ? '은' : '는'
    },
    // 과 / 와
    {
      pattern: /^(과|와)(?=[\s.,!?;:'"\)\]]|$)/,
      fix: () => hasBatchim ? '과' : '와'
    },
    // 이라 / 라, 이라고 / 라고, 이라는 / 라는, 이라면 / 라면, 이라도 / 라도
    {
      pattern: /^(이라고|라고|이라는|라는|이라면|라면|이라도|라도|이라|라)(?=[\s.,!?;:'"\)\]]|$)/,
      fix: (m) => {
        const base = m.replace(/^이/, '');
        return hasBatchim ? '이' + base : base;
      }
    },
    // 이야 / 야, 이여 / 여
    {
      pattern: /^(이야|야|이여|여)(?=[\s.,!?;:'"\)\]]|$)/,
      fix: (m) => {
        const base = m.replace(/^이/, '');
        return hasBatchim ? '이' + base : base;
      }
    }
  ];

  for (const rule of rules) {
    const match = afterText.match(rule.pattern);
    if (match) {
      const origParticle = match[1];
      const fixedParticle = rule.fix(origParticle);
      return {
        particle: fixedParticle,
        rest: afterText.slice(origParticle.length)
      };
    }
  }

  return { particle: '', rest: afterText };
}

const $ = id => document.getElementById(id);
const storageKey = 'admin-language-editor-settings-v1';
let settings = { imported: null, custom: [], exceptions: [] };
try {
  const stored = JSON.parse(localStorage.getItem(storageKey));
  if (stored) settings = { ...settings, ...stored };
} catch {}
let dictionary = new Map();
let segments = [];
let dirty = false;
let analyzedMode = 'press';

function status(message) { $('status').textContent = message; }

function saveSettings() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(settings));
    return '다음에 이 브라우저에서 다시 열면 설정이 유지됩니다.';
  } catch {
    return '이 브라우저에서 설정을 저장할 수 없어 열린 창에만 적용했습니다.';
  }
}

function element(tag, text, className) {
  const node = document.createElement(tag);
  node.textContent = text;
  if (className) node.className = className;
  return node;
}

function escapeRegex(text) { return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function updateDictionary() {
  dictionary = new Map();
  const base = settings.imported || DEFAULT_DICTIONARY;
  for (const [raw, replacement] of base) {
    const candidates = replacement.replace(/[①②③④⑤⑥⑦⑧⑨⑩]/g, '').split(/[,，](?![^()]*\))/).map(value => value.trim()).filter(Boolean);
    for (const term of raw.split('/').map(value => value.trim().replace(/^~\s*/, '')).filter(Boolean)) {
      const previous = dictionary.get(term)?.candidates || [];
      if (candidates.length) dictionary.set(term, { candidates: [...new Set([...previous, ...candidates])], custom: false });
    }
  }
  for (const [term, replacement] of settings.custom) {
    const previous = dictionary.get(term)?.candidates || [];
    dictionary.set(term, { candidates: [...new Set([replacement, ...previous])], custom: true });
  }
  $('dictionaryCount').textContent = (settings.imported ? '불러온 사전 ' : '기본 사전 ') + base.length + '개 · 사용자 ' + settings.custom.length + '개';
  renderLookup();
  renderEntries();
}

function renderLookup() {
  const query = $('lookup').value.trim().toLowerCase();
  const visible = [...dictionary].filter(([term, record]) =>
    term.toLowerCase().includes(query) || record.candidates.some(value => value.toLowerCase().includes(query)));
  $('dictResults').replaceChildren(element('small', visible.length ? '검색 결과 ' + visible.length + '개 중 최대 50개 표시' : '검색 결과가 없습니다.'));
  for (const [term, record] of visible.slice(0, 50)) {
    $('dictResults').append(element('div', term + ' → ' + record.candidates.join(' / ')));
  }
}

function renderEntries() {
  $('entries').replaceChildren();
  for (const [key, heading] of [['custom', '사용자 순화어'], ['exceptions', '예외 표현']]) {
    $('entries').append(element('strong', heading));
    if (!settings[key].length) $('entries').append(element('div', '등록된 항목이 없습니다.', 'note'));
    settings[key].forEach((value, index) => {
      const row = element('div', key === 'custom' ? value.join(' → ') : value, 'row entry');
      const remove = element('button', '삭제');
      remove.addEventListener('click', () => {
        settings[key].splice(index, 1);
        settingsChanged();
      });
      row.append(remove);
      $('entries').append(row);
    });
  }
}

function settingsChanged() {
  updateDictionary();
  const storedMessage = saveSettings();
  status(storedMessage + (segments.length ? ' 새 설정은 다시 검사할 때 반영됩니다.' : ''));
}

function protectedRanges(source, mode) {
  const ranges = [];
  const add = (expression, reason, hard = true) => {
    for (const match of source.matchAll(expression)) {
      ranges.push({ start: match.index, end: match.index + match[0].length, reason, hard });
    }
  };
  for (const value of settings.exceptions) add(new RegExp(escapeRegex(value), 'gu'), '등록한 예외 표현');
  add(/https?:\/\/[^\s<>"'「」]+|[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}/gu, '웹 주소·이메일');
  add(/\d{2,4}[.-]\s*\d{1,2}[.-]\s*\d{1,2}\.?|\d{2,4}년\s*\d{1,2}월(?:\s*\d{1,2}일)?|\d{1,2}월\s*\d{1,2}일|\d{1,2}:\d{2}|\d{1,2}시(?:\s*\d{1,2}분)?|\d{2,4}[- ]\d{3,4}[- ]\d{4}|\d{4}-\d{4}|(?:₩\s*)?\d[\d,.]*\s*(?:억\s*원|만\s*원|천\s*원|원|%|명|세)|제\s*\d+\s*(?:조(?:의\s*\d+)?|항|호)/gu, '날짜·금액·연락처·조항 등');
  add(/「[^」\n]+」|『[^』\n]+』/gu, '법령·문서 제목 표기');
  if (mode === 'notice') {
    add(/^\s*(?:(?:공고|사업|서식|법령)명|(?:접수|신청|모집)\s*기간|문\s*의(?:처)?)\s*[:：][^\n]+/gmu, '공고문 주요 항목');
    add(/\[(?:별지|붙임|서식)[^\]\n]*\]|‘[^’\n]+’|“[^”\n]+”/gu, '공식 명칭 또는 인용 가능성', false);
    add(/^[^\n]{1,100}(?:공고|공고문|계획|모집 안내)[ \t]*$/gmu, '공고 제목 가능성', false);
  }
  return ranges;
}

const wordChar = /[\p{L}\p{N}_]/u;
const suffixPattern = /^(?:으로부터|으로서는|으로써|으로서|으로는|로부터|로서는|로써|로서|로는|으로|로|에게서|에게는|에게|에서는|에서도|에서|에는|에도|에|한테|까지|부터|처럼|밖에|보다|만|도|의|은|는|이|가|을|를|과|와|이라고|라고|이라는|라는|이라면|라면|이라도|라도|이라|라|이야|야|이여|여|입니다|이다)(?![\p{L}\p{N}_])/u;
const grammarBoundary = /^(?:으로는|로는|으로서|로서|으로써|로써|으로|로)(?![\p{L}\p{N}_])/u;

function adjusted(word, suffix) {
  const direction = suffix.match(grammarBoundary);
  if (direction) return ((!hasFinalConsonant(word) || isRieulFinal(word)) ? '로' : '으로') + suffix.replace(/^(으로|로)/, '');
  return adjustFollowingParticle(word, suffix).particle || suffix;
}

function analyze() {
  const source = $('source').value;
  if (!source.trim()) return status('검사할 원문을 입력하세요.');
  if (dirty && !window.confirm('다시 검사하면 현재 수정안과 적용 선택을 새로 만듭니다. 계속할까요?')) return;
  analyzedMode = $('mode').value;
  const ranges = protectedRanges(source, analyzedMode);
  const terms = [...dictionary.keys()].sort((a, b) => b.length - a.length).map(escapeRegex);
  const pattern = terms.length ? new RegExp('(?=(' + terms.join('|') + '))', 'gu') : /(?!) /g;
  segments = [];
  let cursor = 0;
  for (const match of source.matchAll(pattern)) {
    const start = match.index;
    const term = match[1];
    const end = start + term.length;
    if (start < cursor || wordChar.test(source[start - 1] || '')) continue;
    const suffix = source.slice(end).match(suffixPattern)?.[0] || '';
    if (!suffix && wordChar.test(source[end] || '')) continue;
    const overlaps = ranges.filter(range => range.start < end + suffix.length && start < range.end);
    const hard = overlaps.find(range => range.hard);
    const record = dictionary.get(term);
    const verify = hard?.reason || overlaps[0]?.reason || (record.candidates.length > 1 ? '문맥에 따라 대체어 선택' : '');
    if (start > cursor) segments.push({ text: source.slice(cursor, start) });
    const lineStart = source.lastIndexOf('\n', start - 1) + 1;
    const lineEnd = source.indexOf('\n', end);
    segments.push({
      term, suffix, start, hard: Boolean(hard), verify, custom: record.custom,
      context: source.slice(lineStart, lineEnd < 0 ? source.length : lineEnd),
      candidates: record.candidates, choice: record.candidates[0], applied: false
    });
    cursor = end + suffix.length;
  }
  if (cursor < source.length) segments.push({ text: source.slice(cursor) });
  dirty = false;
  $('source').hidden = true;
  $('comparison').hidden = false;
  $('editSource').hidden = false;
  $('copy').disabled = false;
  renderDocuments();
  renderSuggestions();
  renderReadability();
  const matches = segments.filter(part => part.term);
  status('검사 완료 · 순화 후보 ' + matches.filter(part => !part.hard).length + '곳 · 보호 ' + matches.filter(part => part.hard).length + '곳');
}

function valueOf(part) {
  if (!part.term) return part.text;
  return part.applied ? part.choice + adjusted(part.choice, part.suffix) : part.term + part.suffix;
}

function matchClass(part) {
  return part.hard ? 'protected' : part.applied ? 'applied' : '';
}

function renderDocuments() {
  $('comparison').replaceChildren();
  $('result').replaceChildren();
  for (const part of segments) {
    if (!part.term) {
      $('comparison').append(document.createTextNode(part.original ?? part.text));
      const editor = element('span', part.text, 'edit');
      editor.contentEditable = 'plaintext-only';
      editor.setAttribute('aria-label', '수정안의 일반 문구');
      editor.addEventListener('input', () => {
        part.original ??= part.text;
        part.text = editor.innerText.replace(/\r\n/g, '\n');
        dirty = true;
        renderReadability();
      });
      $('result').append(editor);
      continue;
    }
    $('comparison').append(element('mark', part.term + part.suffix, matchClass(part)));
    $('result').append(element('mark', valueOf(part), matchClass(part)));
  }
}

function renderSuggestions() {
  const list = $('suggestions');
  list.replaceChildren();
  const matches = segments.filter(part => part.term);
  if (!matches.length) list.append(element('p', segments.length ? '검출된 사전 용어가 없습니다.' : '원문을 검사하면 이곳에 표시됩니다.'));
  for (const part of matches) {
    const card = element('article', '', 'card');
    const heading = element('div', '', 'row');
    heading.append(element('strong', part.term), element('span',
      part.hard ? '보호 · ' + part.verify : part.verify ? '검토 필요 · ' + part.verify : part.custom ? '사용자 사전' : '기본·불러온 사전', 'badge'));
    card.append(heading, element('p', part.context));
    if (!part.hard) {
      const row = element('div', '', 'row');
      const choice = document.createElement('select');
      choice.setAttribute('aria-label', part.term + ' 순화어');
      for (const candidate of part.candidates) choice.append(new Option(candidate, candidate));
      if (!part.candidates.includes(part.choice)) choice.append(new Option(part.choice, part.choice));
      choice.value = part.choice;
      const manual = document.createElement('input');
      manual.value = part.choice;
      manual.setAttribute('aria-label', part.term + ' 대체어 직접 수정');
      const apply = element('button', part.applied ? '적용 중' : '적용');
      const keep = element('button', '원문 유지');
      apply.setAttribute('aria-pressed', String(part.applied));
      apply.onclick = () => {
        if (!manual.value.trim()) return status('적용할 표현을 입력하세요.');
        part.choice = manual.value.trim();
        changePart(part, true);
      };
      keep.onclick = () => changePart(part, false);
      choice.onchange = () => {
        manual.value = choice.value;
        apply.textContent = '적용';
      };
      row.append(choice, manual, apply, keep);
      card.append(row);
    }
    list.append(card);
  }
}

function changePart(part, applied) {
  part.applied = applied;
  dirty = true;
  renderDocuments();
  renderSuggestions();
  renderReadability();
}

function setAll(applied) {
  const candidates = segments.filter(part => part.term && !part.hard && (!applied || !part.verify));
  if (!candidates.length) return status('일괄 적용할 제안이 없습니다. 검토 필요 항목은 개별로 적용하세요.');
  for (const part of candidates) part.applied = applied;
  dirty = true;
  renderDocuments();
  renderSuggestions();
  renderReadability();
  status(candidates.length + (applied ? '곳에 순화어를 적용했습니다.' : '곳을 원문으로 되돌렸습니다.'));
}

function finalText() { return segments.map(valueOf).join(''); }

function renderReadability() {
  const panel = $('readability');
  panel.replaceChildren();
  const lines = finalText().split('\n');
  let count = 0;
  lines.forEach((line, index) => {
    if (count >= 12) return;
    const sentences = line.trim().split(/(?<=[.!?。])\s+(?=[가-힣A-Z])/u);
    for (const sentence of sentences) {
      if (sentence.length < 85 || count >= 12) continue;
      count++;
      const split = /(?:하고,?|으며,?|지만,?|한편,?|또한,?|다음과 같으며,?)\s+/u.exec(sentence.slice(25));
      const card = element('article', '', 'card');
      card.append(element('strong', (index + 1) + '번째 줄 · 긴 문장'));
      if (split) {
        const boundary = 25 + split.index + split[0].length;
        card.append(element('p', sentence.slice(0, boundary).trimEnd() + '\n↳ ' + sentence.slice(boundary)));
        card.append(element('small', '↳ 앞에서 문장을 나누고, 앞 문장의 끝맺음을 다듬어 보세요.'));
      } else {
        card.append(element('p', sentence), element('small', '안내 내용이나 조건이 달라지는 지점에서 문장을 나눠 보세요.'));
      }
      panel.append(card);
    }
  });
  if (analyzedMode === 'notice') {
    lines.forEach((line, index) => {
      if (count >= 12) return;
      const labels = [...line.matchAll(/(?:신청|접수|모집)\s*(?:대상|기간|방법)\s*[:：]/gu)];
      if (labels.length < 2) return;
      count++;
      const card = element('article', '', 'card');
      card.append(element('strong', (index + 1) + '번째 줄 · 신청 안내 분리'), element('p', line.replace(/\s*((?:신청|접수|모집)\s*(?:대상|기간|방법)\s*[:：])/gu, '\n$1').trim()), element('small', '각 항목을 한 줄씩 배치해 보세요.'));
      panel.append(card);
    });
  }
  if (!count) panel.append(element('p', segments.length ? '표시할 문장 다듬기 제안이 없습니다.' : '검사한 문서에서 긴 문장과 한 줄에 모인 신청 안내를 확인합니다.'));
}

function zipIndex(buffer) {
  const view = new DataView(buffer);
  const files = new Map();
  let end = buffer.byteLength - 22;
  const minimum = Math.max(0, end - 65535);
  while (end >= minimum && (view.getUint32(end, true) !== 0x06054b50 ||
    end + 22 + view.getUint16(end + 20, true) !== buffer.byteLength)) end--;
  if (end < minimum) throw new Error('올바른 .xlsx 파일을 선택하세요.');
  const count = view.getUint16(end + 10, true);
  let offset = view.getUint32(end + 16, true);
  const decoder = new TextDecoder();
  for (let index = 0; index < count; index++) {
    if (view.getUint32(offset, true) !== 0x02014b50) throw new Error('엑셀 파일 구조를 읽을 수 없습니다.');
    const nameLength = view.getUint16(offset + 28, true);
    const extra = view.getUint16(offset + 30, true);
    const comment = view.getUint16(offset + 32, true);
    const name = decoder.decode(new Uint8Array(buffer, offset + 46, nameLength));
    files.set(name, {
      method: view.getUint16(offset + 10, true),
      compressed: view.getUint32(offset + 20, true),
      size: view.getUint32(offset + 24, true),
      start: view.getUint32(offset + 42, true)
    });
    offset += 46 + nameLength + extra + comment;
  }
  return async name => {
    const file = files.get(name);
    if (!file) return null;
    if (file.size > 12 * 1024 * 1024) throw new Error('엑셀 시트가 너무 큽니다.');
    const header = file.start;
    if (view.getUint32(header, true) !== 0x04034b50) throw new Error('엑셀 파일이 손상되었습니다.');
    const start = header + 30 + view.getUint16(header + 26, true) + view.getUint16(header + 28, true);
    const bytes = new Uint8Array(buffer, start, file.compressed);
    if (file.method === 0) return decoder.decode(bytes);
    if (file.method !== 8 || typeof DecompressionStream === 'undefined') throw new Error('최신 Chrome 또는 Edge에서 엑셀을 불러오세요.');
    const reader = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')).getReader();
    const chunks = [];
    let length = 0;
    try {
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        length += value.length;
        if (length > file.size) throw new Error('엑셀 파일이 손상되었습니다.');
        chunks.push(value);
      }
    } finally {
      await reader.cancel();
    }
    return new Blob(chunks).text();
  };
}

function xmlDocument(content) {
  if (!content) return null;
  const doc = new DOMParser().parseFromString(content, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('엑셀 시트 내용을 읽을 수 없습니다.');
  return doc;
}

function tags(node, name) { return [...(node?.getElementsByTagNameNS('*', name) || [])]; }
function richText(node) { return tags(node, 't').filter(tag => tag.parentNode.localName !== 'rPh').map(tag => tag.textContent).join(''); }

async function loadWorkbook(file) {
  if (file.size > 12 * 1024 * 1024) throw new Error('12MB 이하의 엑셀 파일을 선택하세요.');
  const read = zipIndex(await file.arrayBuffer());
  const [book, relationships, shared] = await Promise.all(
    ['xl/workbook.xml', 'xl/_rels/workbook.xml.rels', 'xl/sharedStrings.xml'].map(async path => xmlDocument(await read(path))));
  const strings = tags(shared, 'si').map(richText);
  const paths = new Map(tags(relationships, 'Relationship').filter(rel => rel.getAttribute('TargetMode') !== 'External')
    .map(rel => [rel.getAttribute('Id'), rel.getAttribute('Target')]));
  for (const sheet of tags(book, 'sheet')) {
    const id = [...sheet.attributes].find(attr => attr.localName === 'id')?.value;
    const target = paths.get(id);
    if (!target) continue;
    const path = new URL(target, 'https://workbook.invalid/xl/').pathname.slice(1);
    const doc = xmlDocument(await read(path));
    let columns;
    const rows = [];
    for (const row of tags(doc, 'row')) {
      const cells = new Map();
      for (const cell of tags(row, 'c')) {
        const col = cell.getAttribute('r')?.match(/^[A-Z]+/)?.[0];
        if (!col) continue;
        const raw = tags(cell, 'v')[0]?.textContent || '';
        const type = cell.getAttribute('t');
        const value = type === 's' ? strings[Number(raw)] : type === 'inlineStr' ? richText(cell) : raw;
        cells.set(col, (value || '').trim());
      }
      if (!columns) {
        const headers = [...cells].map(([col, value]) => [value.replace(/\s/g, ''), col]);
        const byName = new Map(headers);
        if (byName.has('대상용어') && byName.has('순화어')) columns = [byName.get('대상용어'), byName.get('순화어')];
        continue;
      }
      const pair = columns.map(col => cells.get(col));
      if (pair.every(Boolean)) rows.push(pair);
    }
    if (rows.length) return rows;
  }
  throw new Error('‘대상 용어’와 ‘순화어’ 열 및 데이터가 있는 시트를 찾지 못했습니다.');
}

$('xlsx').addEventListener('change', async event => {
  const file = event.target.files[0];
  if (!file) return;
  event.target.disabled = $('resetDict').disabled = true;
  try {
    settings.imported = await loadWorkbook(file);
    settingsChanged();
    status(settings.imported.length + '개를 불러왔습니다. ' + $('status').textContent);
  } catch (error) {
    status('사전 불러오기 실패 · ' + error.message);
  } finally {
    event.target.value = '';
    event.target.disabled = $('resetDict').disabled = false;
  }
});

$('lookup').addEventListener('input', renderLookup);
$('resetDict').onclick = () => { settings.imported = null; settingsChanged(); };
$('customForm').addEventListener('submit', event => {
  event.preventDefault();
  const term = $('term').value.trim();
  const replacement = $('replacement').value.trim();
  if (!term || !replacement) return;
  settings.custom = settings.custom.filter(([key]) => key !== term);
  settings.custom.push([term, replacement]);
  event.target.reset();
  settingsChanged();
});
$('exceptForm').addEventListener('submit', event => {
  event.preventDefault();
  const value = $('exception').value.trim();
  if (!value) return;
  if (!settings.exceptions.includes(value)) settings.exceptions.push(value);
  event.target.reset();
  settingsChanged();
});
$('analyze').onclick = analyze;
$('mode').onchange = () => {
  if (segments.length) status('문서 유형을 바꿨습니다. 새 유형으로 검사하려면 검사하기를 누르세요.');
};
$('editSource').onclick = () => {
  $('source').hidden = false;
  $('comparison').hidden = true;
  $('editSource').hidden = true;
  $('source').focus();
  status('원문 편집 후 검사하기를 누르면 반영됩니다.');
};
$('sample').onclick = () => {
  if ($('source').value.trim() && !window.confirm('입력창의 원문을 예문으로 바꿀까요?')) return;
  $('source').value = $('mode').value === 'notice'
    ? '지역 행사 참여자 모집 공고\n사업명: 가금류 체험 교실\n신청 대상: 주민 신청 기간: 11월 20일~11월 25일 신청 방법: 온라인 접수\n세부 일정은 가내시를 받은 뒤 안내합니다.'
    : '주민과 함께하는 농촌 체험\n가금류가 생활하는 공간을 둘러보고, 담당자의 설명을 듣습니다.\n마을 입구의 가드레일을 점검합니다.';
  $('source').hidden = false;
  $('comparison').hidden = true;
  $('editSource').hidden = true;
  $('source').focus();
  status('예문을 넣었습니다. 검사하기를 눌러 주세요.');
};
$('applyAll').onclick = () => setAll(true);
$('keepAll').onclick = () => setAll(false);
$('copy').onclick = async () => {
  const value = finalText();
  if (!value.trim()) return status('복사할 수정안이 없습니다.');
  try {
    await navigator.clipboard.writeText(value);
    status('최종본을 복사했습니다.');
  } catch {
    const fallback = document.createElement('textarea');
    fallback.value = value;
    fallback.setAttribute('aria-label', '복사할 최종본');
    $('result').after(fallback);
    fallback.focus();
    fallback.select();
    if (document.execCommand('copy')) {
      fallback.remove();
      status('최종본을 복사했습니다.');
    } else {
      fallback.onblur = () => fallback.remove();
      status('자동 복사를 사용할 수 없습니다. 선택된 최종본을 직접 복사하세요.');
    }
  }
};
