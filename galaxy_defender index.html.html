<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GALAXY DEFENDER</title><style>body{margin:0;background:#071021;color:#eaf4ff;font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:18px}main{width:min(100%,650px)}h1{text-align:center;color:#7dd3fc}#stats,.controls{display:flex;gap:8px;justify-content:space-between;margin:10px 0}#stats span{background:#15233d;padding:10px;border-radius:9px;flex:1;text-align:center;font-weight:bold}#stage{position:relative;height:480px;border:1px solid #314667;border-radius:15px;overflow:hidden;background:#070d24;touch-action:none}canvas{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;background:#060d23dd;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:15px;padding:15px}.overlay h2{font-size:30px;color:#7dd3fc;margin:0}.overlay p{line-height:1.7}button{border:0;border-radius:10px;padding:13px 20px;font-weight:800;cursor:pointer;background:#38bdf8;color:#061323}.controls button{background:#263956;color:white;min-width:65px;touch-action:none}#fire{background:#fb7185;color:#300712}small{color:#a8bdd8}</style></head><body><main><h1>🚀 GALAXY DEFENDER</h1><div id="stats"><span>⭐ 점수 <b id="score">0</b></span><span>❤️ 생명 <b id="life">3</b></span><span>⚡ 레벨 <b id="level">1</b></span><span>🏆 최고 <b id="best">0</b></span></div><div id="stage"><canvas id="canvas"></canvas><div class="overlay" id="overlay"><div style="font-size:60px">🚀</div><h2>GALAXY DEFENDER</h2><p>외계 군단을 격추하고 아이템을 획득하세요!<br>이동: 방향키 / WASD · 발사: 스페이스바</p><button id="start">게임 시작 ▶</button></div></div><div class="controls"><button id="left">◀</button><button id="fire">🔥 발사</button><button id="right">▶</button><button id="pause">일시정지 ⏸</button></div><small>💚 체력 회복 · 💛 3연발 · 💜 보호막 | 모바일: 화면 드래그로 이동</small></main><script>
(()=>{const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d'),stage=$('stage'),overlay=$('overlay');let W=600,H=480,run=false,paused=false,score=0,life=3,level=1,best=0,t=0,last=0,spawn=0,shot=0,power=0,shield=0,inv=0;let bullets=[],enemies=[],particles=[],items=[];const stars=Array.from({length:100},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.3,s:Math.random()*1.8+.4})),keys={},player={x:300,y:420,r:17};function resize(){const r=stage.getBoundingClientRect();W=r.width;H=r.height;c.width=Math.round(W*devicePixelRatio);c.height=Math.round(H*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);player.x=Math.min(W-20,player.x);player.y=Math.min(H-20,player.y)}resize();new ResizeObserver(resize).observe(stage);function ui(){for(const k of ['score','life','level','best'])$(k).textContent=({score,life,level,best})[k]}function start(){score=0;life=3;level=1;t=0;spawn=0;shot=0;power=0;shield=0;inv=0;bullets=[];enemies=[];particles=[];items=[];player.x=W/2;player.y=H-50;run=true;paused=false;overlay.style.display='none';$('pause').textContent='일시정지 ⏸';ui()}$('start').onclick=start;$('pause').onclick=()=>{if(run){paused=!paused;$('pause').textContent=paused?'계속하기 ▶':'일시정지 ⏸'}};function end(){run=false;best=Math.max(best,score);ui();overlay.style.display='flex';overlay.innerHTML='<div style="font-size:60px">🏆</div><h2>게임 종료!</h2><p>최종 점수: '+score+'점<br>도달 레벨: '+level+'</p><button id="restart">다시 도전 🚀</button>';$('restart').onclick=start}function burst(x,y,color,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=Math.random()*3+1;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:35,color})}}function fire(){if(shot>0)return;shot=power>0?10:17;for(const dx of(power>0?[-13,0,13]:[0]))bullets.push({x:player.x+dx,y:player.y-18,vx:dx*.13,vy:-9,r:4})}function hit(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r}function update(dt){t+=dt;level=1+Math.floor(score/200);spawn-=dt;shot=Math.max(0,shot-dt);power=Math.max(0,power-dt);shield=Math.max(0,shield-dt);inv=Math.max(0,inv-dt);const speed=5*dt;if(keys.ArrowLeft||keys.a||keys.left)player.x-=speed;if(keys.ArrowRight||keys.d||keys.right)player.x+=speed;if(keys.ArrowUp||keys.w)player.y-=speed;if(keys.ArrowDown||keys.s)player.y+=speed;player.x=Math.max(20,Math.min(W-20,player.x));player.y=Math.max(45,Math.min(H-22,player.y));if(keys[' ']||keys.fire)fire();if(spawn<=0){spawn=Math.max(12,47-level*3)+Math.random()*18;const big=Math.random()<Math.min(.12+level*.015,.35);enemies.push({x:25+Math.random()*(W-50),y:-30,r:big?23:15,hp:big?3:1,vy:(big?1.3:2.1)+level*.23,phase:Math.random()*6,kind:big?1:0})}bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});bullets=bullets.filter(b=>b.y>-20);for(const e of enemies){e.y+=e.vy*dt;e.x+=Math.sin(t*.045+e.phase)*.6*dt}for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(e.y>H+35){enemies.splice(i,1);continue}if(inv<=0&&hit(e,player)){enemies.splice(i,1);burst(e.x,e.y,'#fb7185');if(shield<=0){life--;inv=75;if(life<=0){end();return}}continue}for(let j=bullets.length-1;j>=0;j--)if(hit(e,bullets[j])){bullets.splice(j,1);e.hp--;burst(e.x,e.y,'#fbbf24',3);if(e.hp<=0){score+=e.kind?35:10;burst(e.x,e.y,e.kind?'#c084fc':'#fb7185',18);if(Math.random()<.12)items.push({x:e.x,y:e.y,r:12,type:Math.floor(Math.random()*3)});enemies.splice(i,1)}break}}for(let i=items.length-1;i>=0;i--){const a=items[i];a.y+=1.8*dt;if(hit(a,player)){if(a.type===0)life=Math.min(5,life+1);if(a.type===1)power=650;if(a.type===2)shield=600;burst(a.x,a.y,'#86efac');items.splice(i,1)}else if(a.y>H+20)items.splice(i,1)}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);ui()}function draw(){ctx.fillStyle='#070d24';ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=.3+s.r*.3;ctx.fillStyle='#c7e8ff';ctx.beginPath();ctx.arc(s.x*W,(s.y*H+t*s.s*.28)%H,s.r,0,7);ctx.fill()}ctx.globalAlpha=1;for(const b of bullets){ctx.shadowColor='#67e8f9';ctx.shadowBlur=12;ctx.fillStyle='#a5f3fc';ctx.fillRect(b.x-3,b.y-10,6,17)}ctx.shadowBlur=0;for(const e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle=e.kind?'#a855f7':'#f43f5e';ctx.beginPath();ctx.moveTo(0,e.r);ctx.lineTo(-e.r,-e.r*.5);ctx.lineTo(-e.r*.5,-e.r*.8);ctx.lineTo(0,-e.r*.4);ctx.lineTo(e.r*.5,-e.r*.8);ctx.lineTo(e.r,-e.r*.5);ctx.closePath();ctx.fill();ctx.fillStyle='#ffe9a3';ctx.fillRect(-7,-4,5,5);ctx.fillRect(3,-4,5,5);ctx.restore()}for(const a of items){ctx.beginPath();ctx.arc(a.x,a.y,13,0,7);ctx.fillStyle=['#16a34a','#eab308','#9333ea'][a.type];ctx.fill();ctx.fillStyle='white';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText(['+','×3','◈'][a.type],a.x,a.y+5)}for(const p of particles){ctx.globalAlpha=Math.min(1,p.life/25);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;if(!run&&t===0)return;if(!(inv>0&&Math.floor(t/5)%2===0)){ctx.save();ctx.translate(player.x,player.y);if(shield>0){ctx.strokeStyle='#c084fc';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,27,0,7);ctx.stroke()}ctx.fillStyle='#fb923c';ctx.beginPath();ctx.moveTo(-8,13);ctx.lineTo(0,22+Math.random()*12);ctx.lineTo(8,13);ctx.fill();ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(18,16);ctx.lineTo(0,9);ctx.lineTo(-18,16);ctx.closePath();ctx.fill();ctx.fillStyle='#e0f2fe';ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(5,1);ctx.lineTo(-5,1);ctx.fill();ctx.restore()}if(paused){ctx.fillStyle='#07152bbd';ctx.fillRect(0,0,W,H);ctx.fillStyle='white';ctx.font='bold 27px sans-serif';ctx.textAlign='center';ctx.fillText('일시정지',W/2,H/2)}}function loop(now){const dt=Math.min(2,(now-last)/16.667||1);last=now;if(run&&!paused)update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);function key(e,down){if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','a','d','w','s'].includes(e.key)){e.preventDefault();keys[e.key]=down}}window.addEventListener('keydown',e=>key(e,true));window.addEventListener('keyup',e=>key(e,false));for(const[id,k]of[['left','left'],['right','right'],['fire','fire']]){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;el.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>keys[k]=false)}stage.addEventListener('pointermove',e=>{if(e.buttons===1&&run){const r=stage.getBoundingClientRect();player.x=Math.max(20,Math.min(W-20,e.clientX-r.left));player.y=Math.max(40,Math.min(H-22,e.clientY-r.top));keys.fire=true}});stage.addEventListener('pointerup',()=>keys.fire=false)})();
</script></body></html>
